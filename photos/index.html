          </button>
          <p class="photo-event-count" id="photo-event-count" aria-live="polite" aria-atomic="true"></p>

          </button>
        </div>
        <div id="photo-events">
          <article class="photo-event" id="halloween-2026" aria-labelledby="halloween-2026-title">

              <h2 id="halloween-2026-title">Halloween 2026</h2>
            </header>
            <div class="photo-event-grid photo-event-grid--collage">
              <figure class="photo-collage--decorations">
                <a href="/assets/photos/halloween-2026/IMG_0040.jpeg?v=2">
                  <img src="/assets/photos/halloween-2026/IMG_0040.jpeg?v=2" width="1536" height="2048" alt="A lab office decorated with cobwebs, Halloween dolls, purple lights, and miniature gravestones." loading="lazy" decoding="async">
                </a>
              </figure>
              <figure class="photo-collage--people">
                <a href="/assets/photos/halloween-2026/IMG_0068.jpeg">
                  <img src="/assets/photos/halloween-2026/IMG_0068.jpeg" width="1324" height="2048" alt="Two lab members smiling beside a bowl of Halloween candy and cobweb decorations." decoding="async">
                </a>
              </figure>
              <figure class="photo-collage--small">
                <a href="/assets/photos/halloween-2026/IMG_0064.jpeg">
                  <img src="/assets/photos/halloween-2026/IMG_0064.jpeg" width="1059" height="2048" alt="A pink Halloween doll holding a model brain beside a decorated lab whiteboard." loading="lazy" decoding="async">
                </a>
              </figure>
              <figure class="photo-collage--spider">
                <a href="/assets/photos/halloween-2026/IMG_0096.jpeg">
                  <img src="/assets/photos/halloween-2026/IMG_0096.jpeg" width="1536" height="2048" alt="A lab member posing beside a giant spider drawing, paper ghosts, and bats on the whiteboard." decoding="async">
