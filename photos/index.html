<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Ramamurthy Lab at UC Riverside maps cellular and circuit mechanisms of attention in health and disease.">
  <meta name="theme-color" content="#e8e5e3">
  <title>Photos | Ramamurthy Lab | UC Riverside</title>
  <link rel="icon" href="/assets/favicon.ico?v=4" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" href="/assets/favicon-32.png?v=4" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=4" sizes="any">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=4" sizes="180x180">
  <link rel="stylesheet" href="/styles.css?v=26">
  <link rel="stylesheet" href="/photos/gallery.css?v=1">
  <script src="/script.js?v=4" defer></script>
  <script src="/photos/gallery.js?v=1" defer></script>
  <link rel="canonical" href="https://ramamurthylab.github.io/photos/">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="wordmark" href="/" aria-label="Ramamurthy Lab home">
      <img class="wordmark-logo" src="/assets/lab-logo.svg" width="160" height="111" alt="">
      <span class="wordmark-text"><span class="wordmark-name">Ramamurthy Lab</span><span class="wordmark-affiliation">University of California, Riverside</span></span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" hidden>Menu <span aria-hidden="true">+</span></button>
    <nav id="main-nav" aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/research/">Research</a>
      <a href="/team/">Team</a>
      <a href="/publications/">Publications</a>
      <a href="/news/">News</a>
      <a href="/photos/" aria-current="page">Photos</a>
      <a href="/contact/">Contact</a>
    </nav>
  </header>

  <main id="main">
    <section class="section wrap" id="photos" aria-labelledby="photos-title">
      <h1 class="page-title" id="photos-title">Photos</h1>
      <p id="photos-empty">Photos coming soon.</p>
      <div class="photo-gallery" id="photo-gallery" role="region" aria-label="Photos by event" hidden>
        <div class="photo-event-controls" id="photo-event-controls" hidden>
          <button class="photo-event-arrow photo-event-arrow--previous" type="button" aria-label="Previous event" aria-controls="photo-events" aria-disabled="true">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M17 3 3 12l14 9Z"/></svg>
          </button>
          <p class="photo-event-count" id="photo-event-count" aria-live="polite" aria-atomic="true"></p>
          <button class="photo-event-arrow photo-event-arrow--next" type="button" aria-label="Next event" aria-controls="photo-events">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="m7 3 14 9-14 9Z"/></svg>
          </button>
        </div>
        <div id="photo-events">
          <!-- Add one .photo-event article per event; see PHOTOS-EDITING.md. -->
        </div>
      </div>
    </section>
  </main>
</body>
</html>
